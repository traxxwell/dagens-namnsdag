<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#274C77">
  <meta name="description" content="Dagens namnsdag och lunch på Tystberga skola.">
  <title>Namnsdag & lunch – Tystberga</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --day-background:#274C77; --day-text:#A3CEF1; --day-primary:#A3CEF1; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; padding: max(22px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom)); background:var(--day-background); color:var(--day-text); font-family:"Quicksand",sans-serif; display:flex; justify-content:center; align-items:center; }
    main { width:min(100%,480px); }
    header { text-align:center; margin-bottom:22px; }
    .eyebrow { font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; opacity:.65; }
    h1 { margin:7px 0 0; font-size:clamp(25px,7vw,34px); font-weight:700; letter-spacing:-.04em; }
    .date { margin-top:8px; font-size:14px; font-weight:600; opacity:.65; }
    .panel { background:color-mix(in srgb, var(--day-text) 10%, var(--day-background)); color:var(--day-text); border:1px solid color-mix(in srgb, var(--day-text) 22%, transparent); border-radius:24px; padding:25px 22px; text-align:center; box-shadow:0 12px 30px #00000012; position:relative; overflow:hidden; }
    .panel + .panel { margin-top:14px; }
    .panel:after { content:""; position:absolute; bottom:0; left:0; right:0; height:5px; background:var(--day-primary); }
    .label { color:var(--day-text); font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; }
    .value { margin:12px 0 0; font-size:clamp(25px,7vw,35px); font-weight:700; line-height:1.2; overflow-wrap:anywhere; white-space:pre-line; }
    .meal { font-size:clamp(21px,5.8vw,29px); }
    .school { margin-top:12px; font-size:13px; font-weight:600; color:var(--text); opacity:.85; }
    .status { margin-top:16px; min-height:18px; text-align:center; font-size:12px; font-weight:600; opacity:.55; }
    .refresh { display:block; margin:14px auto 0; border:0; border-radius:999px; padding:11px 18px; background:var(--day-primary); color:var(--day-background); font:700 14px "Quicksand",sans-serif; cursor:pointer; }
    .refresh.secondary { margin-top:10px; background:transparent; color:var(--day-text); border:1px solid color-mix(in srgb, var(--day-text) 45%, transparent); }
    .credit { margin:16px auto 0; text-align:center; font-size:12px; font-weight:600; opacity:.55; }
    .install-cta { display:block; width:100%; margin:12px auto 0; border:1px solid color-mix(in srgb, var(--day-text) 38%, transparent); border-radius:999px; padding:13px 18px; background:color-mix(in srgb, var(--day-text) 12%, var(--day-background)); color:var(--day-text); font:700 14px "Quicksand",sans-serif; cursor:pointer; }
    .install-cta:active { transform:scale(.99); }
    .guide-backdrop { position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center; padding:18px; background:#0009; }
    .guide-backdrop.open { display:flex; }
    .guide { width:min(100%,440px); max-height: min(85svh,700px); overflow:auto; background:var(--day-background); color:var(--day-text); border:1px solid color-mix(in srgb, var(--day-text) 28%, transparent); border-radius:24px; padding:24px 20px; box-shadow:0 20px 60px #0005; }
    .guide h2 { margin:0 0 10px; font-size:23px; }
    .guide p, .guide li { font-size:15px; line-height:1.55; }
    .guide ol { padding-left:22px; }
    .guide .refresh { width:100%; }
    .guide .guide-close { background:transparent; color:var(--day-text); border:1px solid color-mix(in srgb, var(--day-text) 45%, transparent); }

  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">Tystberga skola</div>
      <h1>Namnsdag & lunch</h1>
      <div class="date" id="date">Hämtar dagens datum…</div>
    </header>
    <section class="panel" aria-live="polite">
      <div class="label">Namnsdag</div>
      <div class="value" id="names">Hämtar…</div>
    </section>
    <section class="panel" aria-live="polite">
      <div class="label">Dagens lunch</div>
      <div class="value meal" id="meal">Hämtar…</div>
    </section>
    <a class="refresh secondary" href="./veckans-lunch.html" style="text-decoration:none;text-align:center">Visa veckans lunch</a>
    <div class="status" id="status"></div>
    <button class="refresh" type="button" id="refresh">Uppdatera</button>
    <button class="install-cta" type="button" id="showInstallGuide">Vill du lägga till denna sida?</button>
    <div class="credit">Denna widget är programmerad av Tony Ejremar.</div>
    <div class="guide-backdrop" id="installGuide" role="dialog" aria-modal="true" aria-labelledby="guideTitle">
      <div class="guide">
        <h2 id="guideTitle">Lägg till på hemskärmen</h2>
        <p id="guideIntro">Följ stegen nedan för att skapa en genväg till Namnsdag & lunch.</p>
        <div id="guideSteps"></div>
        <button class="refresh" type="button" id="nativeInstall" hidden>Lägg till på hemskärmen</button>
        <button class="refresh guide-close" type="button" id="closeInstallGuide">Stäng</button>
      </div>
    </div>
  </main>
  <script src="./theme.js"></script>
  <script>
    const namesEl = document.getElementById("names");
    const mealEl = document.getElementById("meal");
    const statusEl = document.getElementById("status");
    const dateEl = document.getElementById("date");

    function todayInSweden() {
      const parts = new Intl.DateTimeFormat("en-CA", { timeZone:"Europe/Stockholm", year:"numeric", month:"2-digit", day:"2-digit" }).formatToParts(new Date());
      const get = type => parts.find(p => p.type === type).value;
      return get("year") + "-" + get("month") + "-" + get("day");
    }
    function extractNames(data) {
      if (Array.isArray(data)) return data.map(x => typeof x === "string" ? x : x?.name || x?.names).flat().filter(Boolean);
      const candidates = data?.names ?? data?.nameDays ?? data?.namedays ?? data?.data ?? data?.result;
      if (Array.isArray(candidates)) return candidates.map(x => typeof x === "string" ? x : x?.name || x?.names).flat().filter(Boolean);
      if (typeof candidates === "string") return [candidates];
      if (typeof data?.name === "string") return [data.name];
      return [];
    }
    async function update() {
      statusEl.textContent = "";
      const formattedDate = new Intl.DateTimeFormat("sv-SE", { timeZone:"Europe/Stockholm", weekday:"long", day:"numeric", month:"long" }).format(new Date());
      const dateParts = formattedDate.split(" ");
      dateParts[0] = dateParts[0].charAt(0).toLocaleUpperCase("sv-SE") + dateParts[0].slice(1);
      dateParts[dateParts.length - 1] = dateParts[dateParts.length - 1].charAt(0).toLocaleUpperCase("sv-SE") + dateParts[dateParts.length - 1].slice(1);
      dateEl.textContent = dateParts.join(" ");
      const tasks = [
        fetch("https://namnsdag.tammergard.se/api/v1/today?countryCode=SE", { cache:"no-store" })
          .then(r => { if (!r.ok) throw Error(); return r.json(); })
          .then(data => { const names = extractNames(data); namesEl.textContent = names.length ? names.join(" & ") : "Ingen namnsdag hittades"; })
          .catch(() => { namesEl.textContent = "Kunde inte hämta namnsdag"; }),
        fetch("./meal.json?t=" + Date.now(), { cache:"no-store" })
          .then(r => { if (!r.ok) throw Error(); return r.json(); })
          .then(data => { if (data.date !== todayInSweden()) throw Error(); mealEl.textContent = data.meal || "Ingen lunchinformation hittades"; })
          .catch(() => { mealEl.textContent = "Dagens lunch uppdateras…"; })
      ];
      await Promise.all(tasks);
      statusEl.textContent = "Senast kontrollerad " + new Intl.DateTimeFormat("sv-SE", { timeZone:"Europe/Stockholm", hour:"2-digit", minute:"2-digit" }).format(new Date());
    }
    function scheduleMidnightUpdate() {
      const now = new Date();
      const parts = new Intl.DateTimeFormat("en-CA", { timeZone:"Europe/Stockholm", year:"numeric", month:"2-digit", day:"2-digit" }).formatToParts(now);
      const get = type => Number(parts.find(p => p.type === type).value);
      const nextDayUtc = Date.UTC(get("year"), get("month") - 1, get("day") + 1);
      const offsetParts = new Intl.DateTimeFormat("en-US", { timeZone:"Europe/Stockholm", timeZoneName:"longOffset" }).formatToParts(new Date(nextDayUtc + 12 * 60 * 60 * 1000));
      const offsetText = offsetParts.find(p => p.type === "timeZoneName").value;
      const match = offsetText.match(/GMT([+-])(\d{2}):(\d{2})/);
      const offsetMinutes = match ? (match[1] === "+" ? 1 : -1) * (Number(match[2]) * 60 + Number(match[3])) : 0;
      const nextMidnight = nextDayUtc - offsetMinutes * 60 * 1000;
      setTimeout(async () => {
        await update();
        scheduleMidnightUpdate();
      }, Math.max(0, nextMidnight - Date.now()));
    }

    let installPromptEvent = null;
    const guideEl = document.getElementById("installGuide");
    const stepsEl = document.getElementById("guideSteps");
    const nativeInstallBtn = document.getElementById("nativeInstall");
    window.addEventListener("beforeinstallprompt", event => {
      event.preventDefault();
      installPromptEvent = event;
      nativeInstallBtn.hidden = false;
    });
    function openInstallGuide() {
      const ua = navigator.userAgent;
      const isIOS = /iPhone|iPad|iPod/i.test(ua);
      const isAndroid = /Android/i.test(ua);
      if (isIOS) {
        stepsEl.innerHTML = '<ol><li>Öppna sidan i <strong>Safari</strong> (inte i en app-webbläsare).</li><li>Tryck på <strong>Dela</strong> – fyrkanten med pilen uppåt.</li><li>Välj <strong>Lägg till på hemskärmen</strong>. Om valet inte syns, scrolla i listan.</li><li>Tryck på <strong>Lägg till</strong> uppe till höger.</li></ol><p>Nu finns genvägen på din hemskärm.</p>';
        nativeInstallBtn.hidden = true;
      } else if (isAndroid) {
        stepsEl.innerHTML = '<ol><li>Tryck på knappen <strong>Lägg till på hemskärmen</strong> nedan om den visas.</li><li>Om ingen knapp visas: tryck på webbläsarens <strong>⋮ meny</strong> uppe till höger.</li><li>Välj <strong>Lägg till på startskärmen</strong> eller <strong>Installera app</strong>.</li><li>Bekräfta genom att trycka på <strong>Lägg till</strong> eller <strong>Installera</strong>.</li></ol><p>Du hittar sedan genvägen på mobilens hemskärm.</p>';
        nativeInstallBtn.hidden = !installPromptEvent;
      } else {
        stepsEl.innerHTML = '<ol><li>Öppna sidan i webbläsaren på mobilen.</li><li>Öppna webbläsarens meny eller Dela-funktion.</li><li>Välj <strong>Lägg till på hemskärmen</strong> och bekräfta.</li></ol>';
        nativeInstallBtn.hidden = !installPromptEvent;
      }
      guideEl.classList.add("open");
      document.body.style.overflow = "hidden";
    }
    function closeInstallGuide() {
      guideEl.classList.remove("open");
      document.body.style.overflow = "";
    }
    document.getElementById("showInstallGuide").addEventListener("click", openInstallGuide);
    document.getElementById("closeInstallGuide").addEventListener("click", closeInstallGuide);
    guideEl.addEventListener("click", event => { if (event.target === guideEl) closeInstallGuide(); });
    nativeInstallBtn.addEventListener("click", async () => {
      if (!installPromptEvent) return;
      installPromptEvent.prompt();
      await installPromptEvent.userChoice;
      installPromptEvent = null;
      nativeInstallBtn.hidden = true;
      closeInstallGuide();
    });
\n    document.getElementById("refresh").addEventListener("click", update);
    update();
    scheduleMidnightUpdate();
  </script>
</body>
</html>
