<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skoldagar kvar till jullovet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 6px;
      overflow: hidden;
      background: var(--day-background, #274C77);
      color: var(--day-text, #A3CEF1);
      font-family: "Quicksand", sans-serif;
    }
    #digits {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }
    .digit {
      display: grid;
      place-items: center;
      flex: 0 0 108px;
      width: 108px;
      height: 116px;
      border: 3px solid var(--day-primary, #A3CEF1);
      border-radius: 12px;
      background: rgba(255,255,255,.10);
      box-shadow: 0 6px 0 rgba(10, 28, 48, .32), inset 0 1px 0 rgba(255,255,255,.14);
      font-size: 86px;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    body::after { content: ""; position: fixed; left: 0; right: 0; bottom: 0; height: 4px; background: var(--day-primary, #A3CEF1); }
  </style>
</head>
<body>
  <main id="digits" aria-live="polite" aria-label="Skoldagar kvar till jullovet"></main>
  <script src="./theme.js"></script>
  <script>
    // Sista skoldagen i Nyköpings kommun höstterminen 2026 är 18 december.
    // Studiedagen 25 november räknas inte som skoldag.
    const LAST_SCHOOL_DAY = "2026-12-18";
    const NON_SCHOOL_DAYS = new Set(["2026-11-25"]);

    function dateInSweden() {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Europe/Stockholm", year: "numeric", month: "2-digit", day: "2-digit"
      }).formatToParts(new Date());
      const get = type => parts.find(p => p.type === type).value;
      return get("year") + "-" + get("month") + "-" + get("day");
    }

    function countSchoolDays() {
      const today = dateInSweden();
      const start = new Date(today + "T12:00:00");
      const end = new Date(LAST_SCHOOL_DAY + "T12:00:00");
      let count = 0;
      const day = new Date(start);
      day.setDate(day.getDate() + 1);
      while (day <= end) {
        const weekday = day.getDay();
        const key = day.getFullYear() + "-" + String(day.getMonth() + 1).padStart(2, "0") + "-" + String(day.getDate()).padStart(2, "0");
        if (weekday !== 0 && weekday !== 6 && !NON_SCHOOL_DAYS.has(key)) count++;
        day.setDate(day.getDate() + 1);
      }
      return count;
    }

    function render() {
      const count = countSchoolDays();
      const value = String(count).padStart(2, "0");
      document.getElementById("digits").innerHTML = [...value]
        .map(digit => '<span class="digit">' + digit + '</span>').join("");
    }

    render();
    setInterval(render, 60 * 60 * 1000);
  </script>
</body>
</html>
