<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dagens mat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; height: 100%; }
    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #274C77;
      color: #A3CEF1;
      font-family: "Quicksand", sans-serif;
      text-align: center;
    }
    main { width: 100%; padding: 1.5rem 2rem; }
    #meal {
      font-size: clamp(1.5rem, 4vw, 3rem);
      font-weight: 700;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }
    #status { font-size: .9rem; opacity: .75; margin-top: 1rem; }
  </style>
</head>
<body>
  <main>
    <div id="meal" aria-live="polite">Hämtar dagens lunch…</div>
    <div id="status"></div>
  </main>
  <script>
    const mealEl = document.getElementById("meal");
    const statusEl = document.getElementById("status");

    function todayInSweden() {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Europe/Stockholm",
        year: "numeric", month: "2-digit", day: "2-digit"
      }).formatToParts(new Date());
      const part = type => parts.find(p => p.type === type).value;
      return part("year") + "-" + part("month") + "-" + part("day");
    }

    async function updateMeal() {
      try {
        const response = await fetch("./meal.json?t=" + Date.now(), { cache: "no-store" });
        if (!response.ok) throw new Error("Matsedeln kunde inte hämtas");
        const data = await response.json();
        if (data.date !== todayInSweden()) throw new Error("Dagens matsedel har inte publicerats ännu");
        mealEl.textContent = data.meal || "Ingen lunchinformation hittades";
        statusEl.textContent = "";
      } catch (error) {
        mealEl.textContent = "Dagens lunch uppdateras…";
        statusEl.textContent = "Matsedeln hämtas automatiskt. Försök igen om en liten stund.";
      }
    }

    updateMeal();
    setInterval(updateMeal, 5 * 60 * 1000);
  </script>
</body>
</html>
