name: Publish namnsdag widget
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch today's lunch from Matilda RSS
        run: |
          python - <<'PY'
          import datetime
          import json
          import urllib.request
          import xml.etree.ElementTree as ET
          from zoneinfo import ZoneInfo

          url = "https://menu.matildaplatform.com/rss?displayMode=Day&distributorId=684ae3739eb9066bde5e1de9&lang=sv"
          today = datetime.datetime.now(ZoneInfo("Europe/Stockholm")).date().isoformat()
          request = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(request, timeout=30) as response:
              root = ET.fromstring(response.read())

          items = root.findall("./channel/item")
          selected = None
          for item in items:
              guid = item.findtext("guid", default="")
              link = item.findtext("link", default="")
              updated = next((node.text or "" for node in item if node.tag.endswith("updated")), "")
              if today in guid or today in link or updated.startswith(today):
                  selected = item
                  break
          if selected is None and len(items) == 1:
              selected = items[0]
          if selected is None:
              raise RuntimeError("No lunch item found for " + today)

          meal = selected.findtext("description", default="").strip()
          if meal.lower().startswith("dagens"):
              meal = meal[6:].strip()
          meal = " ".join(meal.split())
          with open("meal.json", "w", encoding="utf-8") as output:
              json.dump({"date": today, "meal": meal}, output, ensure_ascii=False)
          print("Lunch data prepared for", today)
          PY
      - name: Fetch this week's lunch from Matilda RSS
        run: |
          python - <<'PY'
          import datetime
          import html
          import json
          import re
          import urllib.request
          import xml.etree.ElementTree as ET
          from zoneinfo import ZoneInfo

          today = datetime.datetime.now(ZoneInfo("Europe/Stockholm")).date()
          monday = today - datetime.timedelta(days=today.weekday())
          weekdays = ["Måndag", "Tisdag", "Onsdag", "Torsdag", "Fredag"]
          wanted = {monday + datetime.timedelta(days=i): weekdays[i] for i in range(5)}
          url = "https://menu.matildaplatform.com/rss?displayMode=Week&distributorId=684ae3739eb9066bde5e1de9&lang=sv"
          request = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(request, timeout=30) as response:
              root = ET.fromstring(response.read())

          grouped = {}
          day_names = {name.lower(): i for i, name in enumerate(weekdays)}
          def clean(value):
              value = re.sub(r"<br\s*/?>", " ", value or "", flags=re.I)
              value = re.sub(r"</(?:p|div|li)>", " ", value, flags=re.I)
              value = re.sub(r"<[^>]+>", " ", value)
              return html.unescape(" ".join(value.split())).strip()

          for item in root.findall("./channel/item"):
              fields = [item.findtext(tag, default="") for tag in ("guid", "link", "title", "pubDate")]
              fields += [node.text or "" for node in item if node.tag.endswith("updated")]
              text = " ".join(fields)
              found = re.search(r"\b(20\d{2})[-/.](\d{1,2})[-/.](\d{1,2})\b", text)
              if found:
                  date = datetime.date(int(found.group(1)), int(found.group(2)), int(found.group(3)))
              else:
                  found = re.search(r"\b(\d{1,2})[-/.](\d{1,2})[-/.](20\d{2})\b", text)
                  if found:
                      date = datetime.date(int(found.group(3)), int(found.group(2)), int(found.group(1)))
                  else:
                      day_match = re.search(r"\b(måndag|tisdag|onsdag|torsdag|fredag)\b", text.lower())
                      if not day_match:
                          continue
                      date = monday + datetime.timedelta(days=day_names[day_match.group(1)])
              if date not in wanted:
                  continue

              title = clean(item.findtext("title", default=""))
              description = clean(item.findtext("description", default=""))
              description = re.sub(r"^dagens\s*", "", description, flags=re.I).strip()
              is_side = bool(re.search(r"tillbehör", title + " " + description, re.I))
              description = re.sub(r"^tillbehör\s*[:\-]?\s*", "", description, flags=re.I).strip()
              entry = grouped.setdefault(date, {"date": date.strftime("%d/%m"), "weekday": wanted[date], "meal": "", "accessories": []})
              if is_side:
                  side_text = description or title
                  side_text = re.sub(r"^(?:måndag|tisdag|onsdag|torsdag|fredag)\\s*", "", side_text, flags=re.I)
                  side_text = re.sub(r"^tillbehör\\s*[:\\-]?\\s*", "", side_text, flags=re.I).strip()
                  if side_text:
                      entry["accessories"].append(side_text)
              elif description:
                  if entry["meal"]:
                      entry["meal"] += " • " + description
                  else:
                      entry["meal"] = description

          print("RSS weekly item debug:", [(item.findtext("title", default=""), item.findtext("description", default=""), item.findtext("guid", default="")) for item in root.findall("./channel/item")])
          meals = list(grouped.values())
          meals.sort(key=lambda item: weekdays.index(item["weekday"]))
          for item in meals:
              item["accessories"] = " • ".join(dict.fromkeys(item["accessories"]))
          with open("weeklymeal.json", "w", encoding="utf-8") as output:
              json.dump({"week_start": monday.isoformat(), "meals": meals}, output, ensure_ascii=False)
          print("Weekly lunch entries prepared:", len(meals))
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
